<!doctype html><html lang="en"><meta charset="UTF-8"><title>Retained recovery receipt acceptance</title><style>body{font:16px/1.5 system-ui;max-width:980px;margin:30px auto}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Retained recovery receipt acceptance</h1><p>Isolated synthetic journal only. Full recovery payloads are retained in receipts; legacy digest-only receipts are not upgraded. No active workspace write, automatic restore or product activation.</p><button id="run">Run retained receipt checks</button><p id="status">Ready.</p><pre id="out"></pre><script type="module">
import {createPersistentWorkspaceHistory} from '../../persistentWorkspaceHistory';import {createDurableHistoryRepository,historyCandidateDigest} from '../../durableHistoryRepository';import {workspaceStorageKey,createReportRecord,createPublishedSnapshot,normalizeDashboardWorkspace} from '../../workspacePersistence';import {initialDashboard} from '../../documentSeeds';import {syntheticStudy,syntheticStudySums,expectedSyntheticSums} from './syntheticStudy';
const button=document.getElementById('run'),out=document.getElementById('out'),status=document.getElementById('status');const assert=(value,label)=>{if(!value)throw Error(label);};async function rejects(p){let failed=false;try{await p;}catch{failed=true;}assert(failed,'Expected explicit failure');}
button.onclick=async()=>{button.disabled=true;const name='ecofocus-synthetic-retained-receipts-'+Date.now(),repos=[],cases=[],before=localStorage.getItem(workspaceStorageKey);let failure=null,abortReceipt=false;const stores=[];const pass=label=>{cases.push(label);out.textContent=JSON.stringify({passed:cases.length,cases},null,2);};
const factory={open(dbName,version){const request=indexedDB.open(dbName,version);request.addEventListener('success',()=>{const db=request.result,transaction=db.transaction.bind(db);db.transaction=(...args)=>{const tx=transaction(...args);if(args[1]==='readwrite'&&abortReceipt){const objectStore=tx.objectStore.bind(tx);tx.objectStore=storeName=>{const store=objectStore(storeName);if(storeName==='reconciledHistory'){const add=store.add.bind(store);store.add=value=>{const result=add(value);if(value.id==='atomic-abort')result.addEventListener('success',()=>tx.abort());return result;};}return store;};}return tx;};});return request;}};
const repo=()=>{const value=createDurableHistoryRepository(name,factory);repos.push(value);return value;};async function raw(store,key,value){const db=await new Promise((yes,no)=>{const r=indexedDB.open(name,1);r.onsuccess=()=>yes(r.result);r.onerror=()=>no(r.error);});try{return await new Promise((yes,no)=>{const tx=db.transaction(store,value===undefined?'readonly':'readwrite'),r=value===undefined?tx.objectStore(store).get(key):tx.objectStore(store).put(value);let result;r.onsuccess=()=>result=r.result;tx.oncomplete=()=>yes(result);tx.onabort=()=>no(tx.error);});}finally{db.close();}}
try{
 const {dataset}=await syntheticStudy(1000,60),workspace=normalizeDashboardWorkspace({id:'synthetic-retention-workspace',reports:[createReportRecord({...structuredClone(initialDashboard),importedDatasets:[dataset]})],importedDatasets:[dataset]}),saved=createPublishedSnapshot(workspace,workspace.reports[0].draft),payload=JSON.stringify(saved.workspace),base={version:1,id:'retained-full-workspace',workspaceId:saved.workspace.id,snapshotId:saved.snapshot.id,capturedAt:'2026-11-06T00:00:00Z',payload};
 const initial=repo();await initial.stage(base);await initial.reconcile(base);const receipt=await raw('reconciledHistory',base.id),originalReceipt=JSON.stringify(receipt);assert(receipt.version===2&&receipt.candidate.payload===payload&&receipt.digest===await historyCandidateDigest(base)&&await raw('historyCandidates',base.id)===undefined,'Full payload was not atomically retained');pass('Reconciliation retains exact full candidate and digest before pending entry disappears');
 assert((await initial.inspect()).candidates.length===0&&(await initial.inspectRetained()).candidates.length===1,'Retained history was silently treated as pending');pass('Retained copies are separate from pending recovery and not restored automatically');await initial.close();
 const reopened=repo(),retained=await reopened.inspectRetained(),copy=JSON.parse(retained.candidates[0].payload),expected=expectedSyntheticSums(1000),current=syntheticStudySums(copy.importedDatasets[0]),historical=syntheticStudySums(copy.publishedSnapshots[0].dashboard.importedDatasets[0]);assert(copy.importedDatasets[0].rows.length===1000&&copy.importedDatasets[0].fields.length===60&&copy.reports.length===1&&copy.publishedSnapshots.length===1&&copy.publishedSnapshots[0].dashboard.importedDatasets[0].rows.length===1000&&Object.entries(expected).every(([key,value])=>current[key]===value&&historical[key]===value),'Cold retained workspace lost rows/history or changed values');pass('Cold reopen retains 1000x60 current study, report, snapshot and 1000 historical rows with both sum oracles');
 assert((await reopened.stage(base)).kind==='reconciled'&&JSON.stringify(await raw('reconciledHistory',base.id))===originalReceipt,'Retry replaced or duplicated retained receipt');await reopened.reconcile(base);assert(JSON.stringify(await raw('reconciledHistory',base.id))===originalReceipt,'Reconcile retry altered receipt');pass('Old stage and reconciliation retries preserve the exact existing retained receipt');
 const legacy={...base,id:'legacy-digest-only'},legacyReceipt={version:1,id:legacy.id,digest:await historyCandidateDigest(legacy)};await raw('reconciledHistory',legacy.id,legacyReceipt);const mixed=await reopened.inspectRetained();assert(mixed.legacyReceipts===1&&mixed.candidates.length===1,'Legacy digest receipt invented a recoverable payload');const legacyRetry=await reopened.stage(legacy);assert(legacyRetry.kind==='reconciled'&&legacyRetry.payloadRetained===false&&JSON.stringify(await raw('reconciledHistory',legacy.id))===JSON.stringify(legacyReceipt),'Legacy retry upgraded or overwrote its receipt');pass('Mixed legacy receipts protect replay without fabricated payloads or automatic upgrades');
 const damaged={...base,id:'damaged-retained'},damagedReceipt={version:2,id:damaged.id,digest:await historyCandidateDigest(damaged),candidate:{...damaged,payload:'damaged payload'}};await raw('reconciledHistory',damaged.id,damagedReceipt);const damagedBefore=JSON.stringify(await raw('reconciledHistory',damaged.id));assert((await reopened.inspectRetained()).unreadableRecords===1,'Corrupted retained payload was trusted');await rejects(reopened.stage(damaged));assert(JSON.stringify(await raw('reconciledHistory',damaged.id))===damagedBefore,'Corrupted retained receipt was changed');pass('Damaged retained payload is flagged, preserved and never authorizes a retry');
 const conflict={...base,id:'live-conflict'};await reopened.stage(conflict);await raw('reconciledHistory',conflict.id,{version:2,id:conflict.id,digest:await historyCandidateDigest(conflict),candidate:conflict});assert((await reopened.inspectRetained()).unreadableRecords===2,'Live candidate/receipt conflict was hidden');await rejects(reopened.reconcile(conflict));assert((await raw('historyCandidates',conflict.id)).payload===payload,'Conflict removed live recovery payload');pass('Retained receipt and live candidate conflict stays preserved for separate review');
 const atomic={...base,id:'atomic-abort'};await reopened.stage(atomic);abortReceipt=true;await rejects(reopened.reconcile(atomic));assert(await raw('reconciledHistory',atomic.id)===undefined&&(await raw('historyCandidates',atomic.id)).payload===payload,'Aborted receipt write lost original candidate');abortReceipt=false;await reopened.reconcile(atomic);assert((await raw('reconciledHistory',atomic.id)).candidate.payload===payload&&await raw('historyCandidates',atomic.id)===undefined,'Retry failed to retain payload atomically');pass('Actual retained-receipt write abort rolls back deletion; retry retains exact original');
 const memoryLegacy=createPersistentWorkspaceHistory({inspect:reopened.inspect,reconcile:reopened.reconcile,close:async()=>{},stage:async record=>{await raw('reconciledHistory',record.id,{version:1,id:record.id,digest:await historyCandidateDigest(record)});return reopened.stage(record);}},()=> 'memory-legacy');stores.push(memoryLegacy);const memoryId=memoryLegacy.remember({workspaceId:base.workspaceId,snapshotId:base.snapshotId,payload});await rejects(memoryLegacy.retryStorage());assert(memoryLegacy.getPending()[0]?.id===memoryId&&memoryLegacy.getPending()[0]?.payload===payload,'Legacy receipt cleared available memory payload');await rejects(memoryLegacy.acknowledge(memoryId));assert(memoryLegacy.getPending()[0]?.payload===payload&&(await raw('reconciledHistory','memory-legacy')).version===1,'Legacy acknowledgement lost or overwrote recovery');pass('Coordinator retains exact available memory payload when legacy receipts contain only a digest');
 const archive=JSON.parse(await reopened.exportRecoveryArchive());assert(archive.records.some(record=>record.store==='reconciledHistory')&&JSON.stringify(archive).includes(JSON.stringify(payload)),'Manual archive omitted retained recovery payload');pass('Read-only storage archive contains retained payloads for manual recovery review');
 assert(before!==null&&localStorage.getItem(workspaceStorageKey)===before,'Existing primary saved workspace changed or absent');pass('Existing primary workspace is present and exact unchanged');
}catch(error){failure=error.message;}
finally{await Promise.all(stores.map(value=>value.close()));await Promise.all(repos.map(value=>value.close()));let cleanupError=null;try{await new Promise((yes,no)=>{const r=indexedDB.deleteDatabase(name);r.onsuccess=yes;r.onerror=()=>no(r.error);r.onblocked=()=>no(Error('Synthetic cleanup blocked'));});}catch(error){cleanupError=error.message;}
 status.textContent=failure?'FAILED: '+failure:cleanupError?'Cleanup failed: '+cleanupError:'Passed '+cases.length+' retained-receipt checks; synthetic namespace cleaned.';out.textContent=JSON.stringify({passed:cases.length,cases,failure,cleanupError,activeWorkspaceUnchanged:localStorage.getItem(workspaceStorageKey)===before,productDurabilityActivated:false,limitations:['Legacy v1 receipts still have no payload','No real UI Keep/workspace writer/power-loss acceptance','No receipt purge or automatic restore']},null,2);}}
</script></html>
