<!doctype html><html lang="en"><meta charset="UTF-8"><title>True two-tab journal acceptance</title><style>body{font:16px/1.5 system-ui;max-width:980px;margin:30px auto}pre{white-space:pre-wrap}button{padding:12px}</style><h1>True two-tab journal acceptance</h1><p>Separate browser documents coordinate through BroadcastChannel and race real IndexedDB transactions in one disposable synthetic namespace. This does not test the active workspace writer or activate durable recovery.</p><p id="role"></p><a id="worker">Open matching worker tab</a><button id="run" disabled>Run true two-tab journal checks</button><pre id="out">Waiting for worker.</pre><script type="module">
import {createDurableHistoryRepository} from '../../durableHistoryRepository';import {workspaceStorageKey} from '../../workspacePersistence';
const requested=decodeURIComponent(location.hash.slice(1)),name=requested||'ecofocus-synthetic-two-tab-'+Date.now();if(!/^ecofocus-synthetic-two-tab-[0-9]+$/.test(name))throw Error('Only synthetic two-tab namespaces are allowed');history.replaceState(null,'','#'+name);
const worker=new URLSearchParams(location.search).get('role')==='worker',documentId=crypto.randomUUID(),channel=new BroadcastChannel(name),out=document.getElementById('out'),button=document.getElementById('run');let repository=createDurableHistoryRepository(name);document.getElementById('role').textContent=(worker?'Worker':'Controller')+' document '+documentId;
const link=document.getElementById('worker');link.href=location.pathname+'?role=worker#'+name;link.textContent=worker?'Worker ready; return to controller.':'Open matching worker tab';let sequence=0,workerId;const pending=new Map();
function request(action,value){const id=++sequence;return new Promise((yes,no)=>{const timeout=setTimeout(()=>{pending.delete(id);no(Error('Worker timeout: '+action));},8000);pending.set(id,{yes,no,timeout});channel.postMessage({type:'request',id,action,value});});}
channel.onmessage=async event=>{const data=event.data;
 if(worker&&data.type==='hello'){channel.postMessage({type:'ready',documentId});return;}
 if(!worker&&data.type==='ready'){workerId=data.documentId;button.disabled=false;out.textContent='Worker joined: '+workerId;return;}
 if(!worker&&data.type==='response'){const waiting=pending.get(data.id);if(!waiting)return;clearTimeout(waiting.timeout);pending.delete(data.id);data.error?waiting.no(Error(data.error)):waiting.yes(data.value);return;}
 if(worker&&data.type==='request'){try{let value;if(data.action==='stage')value=await repository.stage(data.value);else if(data.action==='reconcile')value=await repository.reconcile(data.value);else if(data.action==='inspect')value=await repository.inspect();else if(data.action==='close'){await repository.close();value='closed';}else if(data.action==='reopen'){await repository.close();repository=createDurableHistoryRepository(name);value=await repository.inspect();}else throw Error('Unknown synthetic action');out.textContent=JSON.stringify({lastAction:data.action,documentId,result:data.action==='inspect'||data.action==='reopen'?{candidates:value.candidates.length,unreadable:value.unreadableRecords}:value},null,2);channel.postMessage({type:'response',id:data.id,value});}catch(error){out.textContent='Expected or reported operation failure: '+error.message;channel.postMessage({type:'response',id:data.id,error:error.message});}}
};if(worker){link.remove();button.remove();channel.postMessage({type:'ready',documentId});}else channel.postMessage({type:'hello'});
const assert=(value,label)=>{if(!value)throw Error(label);};const candidate=id=>({version:1,id,workspaceId:'synthetic',snapshotId:'snapshot',capturedAt:'2026-11-06T00:00:00Z',payload:'original'+String.fromCharCode(0xd800)+'text'});
button.onclick=async()=>{button.disabled=true;const cases=[],before=localStorage.getItem(workspaceStorageKey);let failure=null,cleanupError=null;const pass=label=>{cases.push(label);out.textContent=JSON.stringify({passed:cases.length,cases},null,2);};try{
 assert(workerId&&workerId!==documentId,'Distinct worker document was not established');pass('Distinct controller and worker browser documents are connected');
 const base=candidate('shared');await Promise.all([repository.stage(base),request('stage',base)]);let scan=await repository.inspect();assert(scan.candidates.length===1&&scan.candidates[0].payload===base.payload,'Identical concurrent stages duplicated or changed content');pass('Two tabs stage the same candidate concurrently without duplication');
 let rejected=false;try{await request('stage',{...base,payload:'stale different content'});}catch{rejected=true;}assert(rejected&&(await repository.inspect()).candidates[0].payload===base.payload,'Stale worker replaced another payload');pass('Stale different content is rejected without overwriting the stored candidate');
 const racing=candidate('race');await Promise.all([repository.stage(racing),request('reconcile',racing)]);assert(!(await repository.inspect()).candidates.some(x=>x.id==='race'),'Racing stage survived committed receipt');assert((await request('stage',racing)).kind==='reconciled','Old worker retry did not recognize receipt');pass('Cross-tab stage versus reconciliation and an old retry cannot resurrect a copy');
 const left={...candidate('collision'),payload:'controller-content'},right={...candidate('collision'),payload:'worker-content'},results=await Promise.allSettled([repository.stage(left),request('stage',right)]);scan=await repository.inspect();const stored=scan.candidates.find(x=>x.id==='collision');assert(results.filter(x=>x.status==='fulfilled').length===1&&results.filter(x=>x.status==='rejected').length===1&&[left.payload,right.payload].includes(stored?.payload),'Concurrent conflicting payloads were silently replaced');pass('Conflicting concurrent writes acknowledge one exact payload and reject the other');
 await request('reopen');assert((await request('inspect')).candidates.find(x=>x.id==='shared')?.payload===base.payload,'Worker reopen lost exact original');await repository.reconcile(base);assert((await request('stage',base)).kind==='reconciled'&&!(await repository.inspect()).candidates.some(x=>x.id==='shared'),'Reopened stale worker resurrected acknowledged content');pass('Worker closes and reopens; later stale retries still recognize reconciliation');
 assert(before!==null&&localStorage.getItem(workspaceStorageKey)===before,'Existing active workspace changed or missing');pass('Existing primary saved workspace remains exact and unchanged');
 }catch(error){failure=error.message;}finally{await repository.close();try{await request('close');await new Promise((yes,no)=>{const r=indexedDB.deleteDatabase(name);r.onsuccess=yes;r.onerror=()=>no(r.error);r.onblocked=()=>no(Error('Synthetic cleanup blocked'));});}catch(error){cleanupError=error.message;}
 out.textContent=JSON.stringify({passed:cases.length,cases,failure,cleanupError,controllerDocument:documentId,workerDocument:workerId,activeWorkspaceUnchanged:localStorage.getItem(workspaceStorageKey)===before,productDurabilityActivated:false,limitations:['Journal transactions only; no real workspace writer/UI Keep integration','No quota, permission or power-loss test']},null,2);}}
</script></html>
