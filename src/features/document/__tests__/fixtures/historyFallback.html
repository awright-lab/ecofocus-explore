<!doctype html><html><head><meta charset="UTF-8"><title>Synthetic constructor fallback acceptance</title></head><body><h1>Synthetic constructor fallback acceptance</h1><p>The initial constructor denial is simulated. Retry uses real IndexedDB in an isolated test namespace. No active workspace writes.</p><pre id="out"></pre><button id="retry">Allow synthetic repository construction and retry</button><div id="recovery"></div><script type="module">
import {workspaceStorageKey} from '../../workspacePersistence';import React from 'react';import {createRoot} from 'react-dom/client';import {createDurableHistoryRepository} from '../../durableHistoryRepository';import {createPersistentWorkspaceHistory} from '../../persistentWorkspaceHistory';import {DeferredWorkspaceHistoryRecovery} from '../../DeferredWorkspaceHistoryRecovery';
const name='ecofocus-synthetic-history-fallback-'+Date.now(),before=localStorage.getItem(workspaceStorageKey),source={workspaceId:'synthetic',snapshotId:'synthetic-snapshot',payload:'original'+String.fromCharCode(0xd800)+'text'};let allowed=false,repository,constructCalls=0;
const store=createPersistentWorkspaceHistory(()=>{constructCalls++;if(!allowed)throw new DOMException('Simulated storage constructor denial','SecurityError');repository=createDurableHistoryRepository(name);return repository;});const id=store.remember(source),root=createRoot(document.getElementById('recovery'));
root.render(React.createElement(DeferredWorkspaceHistoryRecovery,{workspace:null,onWorkspaceChange:()=>{},history:store}));
try{await store.initialize();}catch{}
await Promise.resolve();document.getElementById('out').textContent=JSON.stringify({constructorFailureCaught:store.getStorageState().phase==='failed',originalMemoryRetained:store.getPending()[0]?.payload===source.payload,durableClaim:store.getDurability(id),constructCalls},null,2);
document.getElementById('retry').onclick=async()=>{try{allowed=true;await store.retryStorage();const scan=await repository.inspect(),checks={memoryIdentityRetained:store.getPending()[0]?.id===id,originalPayloadRetained:store.getPending()[0]?.payload===source.payload,storedOnlyAfterRealAck:store.getDurability(id)==='stored',realJournalHasExactCopy:scan.candidates.length===1&&scan.candidates[0].payload===source.payload,existingWorkspacePresent:before!==null,activeWorkspaceUnchanged:localStorage.getItem(workspaceStorageKey)===before};document.getElementById('out').textContent=JSON.stringify({checks,allPassed:Object.values(checks).every(Boolean)},null,2);document.getElementById('retry').disabled=true;
const cleanup=document.createElement('button');cleanup.textContent='Clean up isolated synthetic fallback journal';cleanup.onclick=async()=>{root.unmount();await store.close();await new Promise((yes,no)=>{const r=indexedDB.deleteDatabase(name);r.onsuccess=yes;r.onerror=()=>no(r.error);r.onblocked=()=>no(Error('Synthetic cleanup blocked'));});cleanup.disabled=true;document.getElementById('out').textContent+='\nSynthetic namespace cleaned; active workspace unchanged: '+(localStorage.getItem(workspaceStorageKey)===before);};document.body.append(cleanup);
}catch(error){document.getElementById('out').textContent='FAILED: '+error.message;}};
</script></body></html>
