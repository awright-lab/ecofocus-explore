<!doctype html><html lang="en"><meta charset="UTF-8"><title>Isolated history lifecycle acceptance</title><style>body{font:16px/1.5 system-ui;max-width:980px;margin:30px auto}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Isolated history lifecycle acceptance</h1><p>Real IndexedDB in disposable synthetic namespaces. Higher-version open, receipt abort, lost acknowledgement and unsupported durability are controlled fault injections. Product recovery remains disabled.</p><button id="run">Run isolated lifecycle checks</button><p id="status">Ready.</p><pre id="results"></pre><script type="module">
import {createDurableHistoryRepository} from '../../durableHistoryRepository';import {createPersistentWorkspaceHistory} from '../../persistentWorkspaceHistory';import {workspaceStorageKey} from '../../workspacePersistence';
const button=document.getElementById('run'),status=document.getElementById('status'),out=document.getElementById('results');
function deferred(){let resolve;const promise=new Promise(yes=>resolve=yes);return{promise,resolve};}
function bounded(p,label){return new Promise((yes,no)=>{const timer=setTimeout(()=>no(Error('Timed out: '+label)),8000);p.then(value=>{clearTimeout(timer);yes(value);},error=>{clearTimeout(timer);no(error);});});}
async function rejects(p,label){let rejected=false;try{await bounded(p,label);}catch(error){if(error.message.startsWith('Timed out:'))throw error;rejected=true;}if(!rejected)throw Error('Expected failure: '+label);}

button.onclick=async()=>{button.disabled=true;const prefix='ecofocus-synthetic-history-lifecycle-'+Date.now(),names=[],repos=[],connections=[],cases=[],original=localStorage.getItem(workspaceStorageKey);let failure=null;
const name=label=>{const value=prefix+'-'+label;names.push(value);return value;};const pass=label=>{cases.push(label);out.textContent=JSON.stringify({cases,passed:cases.length},null,2);};
const repo=(namespace,factory)=>{const value=createDurableHistoryRepository(namespace,factory);repos.push(value);return value;};
const rawOpen=(namespace,version)=>new Promise((yes,no)=>{const r=indexedDB.open(namespace,version);r.onsuccess=()=>{connections.push(r.result);yes(r.result);};r.onerror=()=>no(r.error);});
const candidate=id=>({version:1,id,workspaceId:'synthetic',snapshotId:'synthetic-snapshot',capturedAt:'2026-11-06T00:00:00Z',payload:'original'+String.fromCharCode(0xd800)+'text'});
function instrument(namespace,onTransaction){return{open(dbName,version){const request=indexedDB.open(dbName,version);request.addEventListener('success',()=>{const db=request.result,transaction=db.transaction.bind(db);db.transaction=(...args)=>{const tx=transaction(...args);onTransaction(tx,args);return tx;};});return request;}};}
status.textContent='Running...';try{
 const held=deferred(),namespace=name('pending'),factory={open(dbName,version){const request=indexedDB.open(dbName,version),shim={get result(){return request.result;},get transaction(){return request.transaction;},get error(){return request.error;}};request.onupgradeneeded=()=>shim.onupgradeneeded?.();request.onerror=()=>shim.onerror?.();request.onblocked=()=>shim.onblocked?.();request.onsuccess=()=>held.resolve(()=>shim.onsuccess?.());return shim;}};
 const pending=repo(namespace,factory),opening=pending.inspect(),rejected=rejects(opening,'closed pending open'),release=await bounded(held.promise,'held native open'),closing=pending.close();release();await bounded(Promise.all([closing,rejected]),'pending close');await rejects(pending.inspect(),'closed repository');pass('Close during pending real open rejects late connection safely');
 const blockedName=name('blocked'),blocker=await rawOpen(blockedName,1),blocked=deferred(),late=deferred();const blockedRepo=repo(blockedName,{open(dbName){const request=indexedDB.open(dbName,2);request.addEventListener('blocked',()=>blocked.resolve());request.addEventListener('error',()=>late.resolve());request.addEventListener('success',()=>{request.result.close();late.resolve();});return request;}});const blockedRead=blockedRepo.inspect(),blockedFailure=rejects(blockedRead,'blocked upgrade');await bounded(blocked.promise,'real blocked event');await blockedFailure;await blockedRepo.close();blocker.close();await bounded(late.promise,'abandoned upgrade abort');const unchanged=await rawOpen(blockedName,1);assert(unchanged.version===1&&unchanged.objectStoreNames.length===0,'Abandoned blocked upgrade changed original database');unchanged.close();pass('Actual blocked higher-version open is abandoned without upgrading original database');
 const writeName=name('write');let writing,writeClose;const writeFactory=instrument(writeName,(tx,args)=>{if(args[1]!=='readwrite')return;const objectStore=tx.objectStore.bind(tx);tx.objectStore=storeName=>{const store=objectStore(storeName),add=store.add.bind(store);store.add=(value)=>{const request=add(value);request.addEventListener('success',()=>{writeClose=writing.close();});return request;};return store;};});writing=repo(writeName,writeFactory);assert((await writing.stage(candidate('write'))).kind==='staged','Real write was not acknowledged');await writeClose;const coldWrite=repo(writeName);assert((await coldWrite.inspect()).candidates[0].payload===candidate('write').payload,'Closing during write lost committed copy');await coldWrite.close();pass('Close during real write drains the transaction; cold reopen retains exact payload');
 const strictName=name('strict');let deny=true;const strictFactory={open(dbName,version){const request=indexedDB.open(dbName,version);request.addEventListener('success',()=>{const db=request.result,transaction=db.transaction.bind(db);db.transaction=(...args)=>{if(deny&&args[1]==='readwrite'&&args[2]?.durability==='strict')throw new DOMException('Injected unsupported strict durability','NotSupportedError');return transaction(...args);};});return request;}};const strictRepo=repo(strictName,strictFactory),strict=createPersistentWorkspaceHistory(strictRepo,()=> 'strict-id'),id=strict.remember({workspaceId:'synthetic',snapshotId:'synthetic-snapshot',payload:candidate('x').payload});await rejects(strict.retryStorage(),'unsupported strict durability');assert(strict.getPending()[0].id===id&&strict.getDurability(id)!=='stored'&&(await strictRepo.inspect()).candidates.length===0,'Unsupported strict durability lost memory or claimed storage');deny=false;await strict.retryStorage();assert(strict.getDurability(id)==='stored'&&(await strictRepo.inspect()).candidates[0].payload===candidate('x').payload,'Durability retry failed');await strict.close();pass('Injected strict-durability rejection retains memory and retries through real storage');
 const duplicateName=name('duplicates');let abort=true;const abortFactory=instrument(duplicateName,(tx,args)=>{if(args[1]!=='readwrite')return;const objectStore=tx.objectStore.bind(tx);tx.objectStore=storeName=>{const store=objectStore(storeName);if(storeName==='reconciledHistory'){const add=store.add.bind(store);store.add=value=>{const request=add(value);if(abort&&value.id==='second')request.addEventListener('success',()=>tx.abort());return request;};}return store;};});const duplicateRepo=repo(duplicateName,abortFactory);await duplicateRepo.stage(candidate('first'));await duplicateRepo.stage(candidate('second'));const duplicate=createPersistentWorkspaceHistory(duplicateRepo);await duplicate.initialize();await rejects(duplicate.acknowledge(duplicate.getPending()[0].id),'second physical receipt abort');assert(duplicate.getPending().length===1&&(await duplicateRepo.inspect()).candidates.map(x=>x.id).join(',')==='second','Partial duplicate reconciliation lost remaining candidate');await duplicate.close();abort=false;const coldDuplicateRepo=repo(duplicateName),coldDuplicate=createPersistentWorkspaceHistory(coldDuplicateRepo);await coldDuplicate.initialize();assert(coldDuplicate.getPending().length===1,'Cold reopen hid second duplicate');await coldDuplicate.acknowledge(coldDuplicate.getPending()[0].id);assert(coldDuplicate.getPending().length===0&&(await coldDuplicateRepo.inspect()).candidates.length===0,'Cold duplicate retry failed');await coldDuplicate.close();pass('First receipt commits, second real receipt aborts; cold reopen safely finishes remaining copy');
 const lostName=name('lost-ack'),lostRepo=repo(lostName);await lostRepo.stage(candidate('lost'));const lost=createPersistentWorkspaceHistory({inspect:lostRepo.inspect,stage:lostRepo.stage,close:lostRepo.close,reconcile:async value=>{await lostRepo.reconcile(value);throw Error('Injected lost reconciliation acknowledgement');}});await lost.initialize();await rejects(lost.acknowledge(lost.getPending()[0].id),'lost reconciliation acknowledgement');assert(lost.getPending().length===1&&(await lostRepo.inspect()).candidates.length===0,'Lost ack memory or committed receipt state incorrect');await lost.retryStorage();assert(lost.getPending().length===0&&(await lostRepo.inspect()).candidates.length===0,'Old retry resurrected committed copy');await lost.close();pass('Real committed receipt plus lost acknowledgement retries without resurrection');
 assert(original!==null&&localStorage.getItem(workspaceStorageKey)===original,'Existing saved workspace changed or was absent');pass('Existing primary saved workspace remains exact and unchanged');
}catch(error){failure=error.message;}
finally{for(const connection of connections)connection.close();await Promise.all(repos.map(value=>value.close()));let cleanupError=null;for(const namespace of names){try{await bounded(new Promise((yes,no)=>{const r=indexedDB.deleteDatabase(namespace);r.onsuccess=yes;r.onerror=()=>no(r.error);r.onblocked=()=>no(Error('Synthetic cleanup blocked'));}),'cleanup');}catch(error){cleanupError=error.message;}}
 const unchanged=localStorage.getItem(workspaceStorageKey)===original;status.textContent=failure?'FAILED: '+failure:cleanupError?'Cleanup failed: '+cleanupError:'Passed '+cases.length+' lifecycle checks; all synthetic namespaces cleaned.';out.textContent=JSON.stringify({passed:cases.length,cases,failure,cleanupError,activeWorkspaceUnchanged:unchanged,productDurabilityActivated:false,limitations:['Higher-version request, strict failure, receipt abort and lost ack are fault injections','No real quota or policy denial','No true simultaneous tabs or real workspace writer integration']},null,2);}
};
