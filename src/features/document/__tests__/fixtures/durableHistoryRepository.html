<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated durable history acceptance</title>
<style>body{font:16px/1.5 system-ui;max-width:960px;margin:30px auto;padding:20px;background:#f4f8f4;color:#183b2b}button{padding:12px 18px;font:inherit;background:#245b40;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap;background:white;border:1px solid #c8d9ce;padding:20px}</style>
<h1>Durable history recovery acceptance</h1><p>This developer fixture uses synthetic data in a newly created, disposable IndexedDB namespace. It does not activate durable history in the product or change the current saved workspace.</p><button id="run">Run real IndexedDB checks</button><p id="status" role="status">Ready.</p><pre id="results" aria-label="Acceptance results"></pre>
<script type="module">
import { createDurableHistoryRepository, historyCandidateDigest } from '../../durableHistoryRepository.ts';
import { syntheticStudy } from './syntheticStudy.ts';
const button=document.querySelector('#run'),status=document.querySelector('#status'),output=document.querySelector('#results');
button.onclick=async()=>{
 button.disabled=true;const name=`ecofocus-history-probe-${crypto.randomUUID()}`,cases=[],repos=[];let completed=0,aborted=0,abortStore=null;
 const originalText=localStorage.getItem('insightcanvas_report_workspace_v2');
 const assert=(value,message)=>{if(!value)throw Error(message);};
 const pass=label=>{cases.push(label);output.textContent=JSON.stringify({namespace:name,passed:cases.length,completed,aborted,cases},null,2);};
 const factory={open(dbName,version){const request=indexedDB.open(dbName,version);request.addEventListener('success',()=>{const db=request.result,transaction=db.transaction.bind(db);db.transaction=(...args)=>{const tx=transaction(...args);tx.addEventListener('complete',()=>completed++);tx.addEventListener('abort',()=>aborted++);if(abortStore&&args[1]==='readwrite'){const target=abortStore;abortStore=null;const objectStore=tx.objectStore.bind(tx);tx.objectStore=storeName=>{const store=objectStore(storeName);if(storeName===target){const add=store.add.bind(store);store.add=(...values)=>{const result=add(...values);result.addEventListener('success',()=>tx.abort(),{once:true});return result;};}return store;};}return tx;};},{once:true});return request;}};
 const repository=(custom=factory)=>{const repo=createDurableHistoryRepository(name,custom);repos.push(repo);return repo;};
 async function raw(store,key,value){const db=await new Promise((yes,no)=>{const request=indexedDB.open(name);request.onsuccess=()=>yes(request.result);request.onerror=()=>no(request.error);});try{return await new Promise((yes,no)=>{const tx=db.transaction(store,value===undefined?'readonly':'readwrite'),request=value===undefined?tx.objectStore(store).get(key):tx.objectStore(store).put(value);let result;request.onsuccess=()=>{result=request.result;};tx.oncomplete=()=>yes(result);tx.onabort=()=>no(tx.error);});}finally{db.close();}}
 async function rejects(work){let rejected=false;try{await work();}catch{rejected=true;}assert(rejected,'Expected a rejected storage operation');}
 status.textContent='Running real-engine checks...';
 try{
  const {dataset}=await syntheticStudy(1000,60),payload=JSON.stringify(dataset),base={version:1,id:'first',workspaceId:'synthetic-workspace',snapshotId:'saved-snapshot',capturedAt:new Date().toISOString(),payload};
  const a=repository(),b=repository();assert((await a.stage(base)).kind==='staged','Stage did not acknowledge');assert((await a.inspect()).candidates[0].payload===payload,'Captured bytes changed');pass('A 1,000 by 60 payload is retained after transaction completion');
  await a.close();const reopened=repository(),loaded=(await reopened.inspect()).candidates[0];assert(JSON.parse(loaded.payload).rows.length===1000&&JSON.parse(loaded.payload).fields.length===60,'Rows or fields lost after reopen');pass('Closing and reopening retains complete synthetic rows and fields');
  await reopened.stage(base);assert((await reopened.inspect()).candidates.length===1,'Duplicate stage created another candidate');pass('Exact stage retries are idempotent');
  await rejects(()=>reopened.stage({...base,payload:'different'}));assert((await raw('historyCandidates','first')).payload===payload,'An ID collision replaced recovery bytes');pass('ID reuse with different content fails without overwriting');
  const mutable={...base,id:'captured',payload:'original'},staging=reopened.stage(mutable);mutable.payload='mutated';await staging;assert((await raw('historyCandidates','captured')).payload==='original','Caller mutation affected staged bytes');pass('Caller input is captured before asynchronous work');
  abortStore='historyCandidates';await rejects(()=>reopened.stage({...base,id:'aborted-stage'}));assert(await raw('historyCandidates','aborted-stage')===undefined,'Aborted stage leaked a candidate');pass('Injected stage abort leaves no false durable acknowledgement');
  abortStore='reconciledHistory';await rejects(()=>reopened.reconcile(base));assert((await raw('historyCandidates','first')).payload===payload&&await raw('reconciledHistory','first')===undefined,'Aborted reconciliation lost recovery');pass('Receipt write and candidate deletion roll back together');
  await reopened.reconcile(base);assert(await raw('historyCandidates','first')===undefined&&Boolean(await raw('reconciledHistory','first')),'Reconcile was not atomic');pass('Acknowledged reconciliation atomically deletes the candidate and records its receipt');
  assert((await b.stage(base)).kind==='reconciled'&&await raw('historyCandidates','first')===undefined,'Old retry resurrected a reconciled record');pass('An uncertain old stage cannot resurrect a reconciled copy');
  await rejects(()=>b.stage({...base,payload:'reused-after-reconcile'}));pass('Reconciled IDs cannot be reused with different payloads');
  const shared={...base,id:'concurrent'};await Promise.all([reopened.stage(shared),b.stage(shared)]);assert((await reopened.inspect()).candidates.filter(value=>value.id==='concurrent').length===1,'Concurrent identical stages duplicated');pass('Competing connections keep one exact same-ID candidate');
  const racing={...base,id:'stage-reconcile-race'};await Promise.all([reopened.stage(racing),b.reconcile(racing)]);assert(await raw('historyCandidates',racing.id)===undefined,'Racing stage survived reconciliation');pass('A stage racing reconciliation cannot leave an orphan live copy');
  await raw('historyCandidates','damaged',{version:999,id:'damaged',payload:'raw damaged original'});const scan=await reopened.inspect();assert(scan.unreadableRecords===1&&scan.candidates.some(value=>value.id==='captured'),'Damaged record hid a valid candidate');await rejects(()=>reopened.stage({...base,id:'damaged'}));assert((await raw('historyCandidates','damaged')).payload==='raw damaged original','Damaged data was replaced');pass('Damaged candidates remain untouched while other valid records are inspected');
  const inconsistent={...base,id:'inconsistent'};await reopened.stage(inconsistent);await raw('reconciledHistory',inconsistent.id,{version:1,id:inconsistent.id,digest:await historyCandidateDigest(inconsistent)});await rejects(()=>reopened.stage(inconsistent));assert((await reopened.inspect()).unreadableRecords===2,'Receipt/live disagreement was hidden');pass('A simultaneous receipt and live copy fails closed and remains preserved');
  const corrupt={...base,id:'corrupt-receipt'};await reopened.stage(corrupt);await raw('reconciledHistory',corrupt.id,{version:1,id:corrupt.id,digest:'damaged'});await rejects(()=>reopened.reconcile(corrupt));assert((await raw('historyCandidates',corrupt.id)).payload===payload,'Corrupt receipt cleared original');pass('Corrupt receipts never authorize deletion');
  const opaque={...base,id:'opaque',payload:'opaque\ud800text'};await reopened.stage(opaque);assert((await raw('historyCandidates',opaque.id)).payload===opaque.payload,'Opaque UTF-16 changed');pass('Opaque original UTF-16 strings survive real IndexedDB');
  let opens=0;const retry=repository({open(...args){if(++opens===1)throw Error('Synthetic blocked first open');return factory.open(...args);}});await rejects(()=>retry.inspect());assert((await retry.inspect()).candidates.length>0,'Open retry failed');pass('An initial open failure does not poison later inspection');
  assert(localStorage.getItem('insightcanvas_report_workspace_v2')===originalText,'Original workspace text changed');pass('The active saved workspace remains byte-for-byte unchanged');
  status.textContent=`Passed ${cases.length} real IndexedDB checks.`;
 }catch(error){status.textContent='FAILED: '+(error?.message??String(error));output.textContent+='\n'+String(error?.stack??error);}
 finally{await Promise.all(repos.map(repo=>repo.close()));await new Promise((yes,no)=>{const request=indexedDB.deleteDatabase(name);request.onsuccess=yes;request.onerror=()=>no(request.error);request.onblocked=()=>no(Error('Synthetic cleanup blocked'));}).catch(error=>{status.textContent+=' Cleanup: '+error.message;});button.disabled=false;}
};
</script></html>
